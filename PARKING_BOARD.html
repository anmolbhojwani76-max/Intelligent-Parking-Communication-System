<!doctype html><html><head><meta charset="utf-8"><title>Printable 8-slot parking board</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial,sans-serif;margin:0;color:#000;background:white}h1{font-size:22px;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8mm}.slot{border:3px solid #000;height:65mm;text-align:center;font-size:24px;font-weight:bold;padding-top:4mm;box-sizing:border-box}.road{text-align:center;border-top:2px dashed #333;border-bottom:2px dashed #333;margin:5mm 0;padding:2mm;font-size:15px;letter-spacing:3px}p{font-size:13px}button{padding:10px}@media print{button,.help{display:none}}</style></head><body><h1>Intelligent Parking · Camera demonstration board</h1><button onclick="print()">Print this board</button><p class="help">Print landscape at 100%. Position your camera above it. Define zones inside the black borders, capture an EMPTY reference, then add toy cars or objects.</p><div class="grid"><div class="slot">A01</div><div class="slot">A02</div><div class="slot">A03</div><div class="slot">A04</div></div><div class="road">DRIVE AISLE</div><div class="grid"><div class="slot">A05</div><div class="slot">A06</div><div class="slot">A07</div><div class="slot">A08</div></div></body></html>
